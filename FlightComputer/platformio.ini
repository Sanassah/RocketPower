; RocketFlightComputer — PlatformIO project
; Board: Custom RocketPower PCB (NXP MIMXRT1062), programmed via the
; Teensy 4.1 toolchain/bootloader -- this is not a Teensy dev board, but
; PlatformIO's board/platform packages are how it knows to build/upload for
; this chip at all, so those two values below (platform/board) are fixed
; identifiers from PlatformIO's registry, not names we chose ourselves.

[env:rocketpower]
platform  = teensy    ; PlatformIO's platform package for this toolchain -- not a naming choice
board     = teensy41  ; PlatformIO's board ID for the MIMXRT1062 pinout/linker script this PCB shares -- ditto
framework = arduino

lib_deps =
    adafruit/Adafruit BNO08x@^1.2.3
    adafruit/Adafruit ADXL375@^1.0.1
    adafruit/Adafruit INA260 Library@^1.5.0
    mikalhart/TinyGPSPlus@^1.0.3
    ; Adafruit BMP3XX Library is intentionally NOT listed here -- it's
    ; vendored (with a fix, see lib/Adafruit BMP3XX Library/Adafruit_BMP3XX.cpp)
    ; in this project's own lib/ folder instead. PlatformIO's LDF resolves an
    ; explicitly lib_deps-pinned dependency via its registry-managed copy in
    ; .pio/libdeps regardless of a same-named lib/ folder -- confirmed by a
    ; real build still picking .pio/libdeps over lib/ while this line was
    ; still here. Removing it is what makes LDF fall back to the project
    ; lib/ copy for that header. Don't re-add this line without also
    ; reconciling it with the fork.

build_flags =
    -DROCKETPOWER
    ; Second Teensy USB virtual serial port (SerialUSB1), dedicated to plain-
    ; text bench diagnostics (loop/sensor/GPS/SD timing breakdowns) -- see
    ; config.h's DEBUG_SERIAL macro for why: keeps this text off the normal
    ; Serial port entirely, so it stops interleaving with (and corrupting the
    ; readability of) the binary telemetry mirror on that port. Unlike
    ; [env:rocketpower_hitl] below, this build doesn't use SerialUSB1 for
    ; anything else, so it's free for this.
    -DUSB_DUAL_SERIAL
    -O2

monitor_speed = 115200

; ===========================================================================
; HITL (hardware-in-the-loop) build -- NOT the flight firmware. Same source
; tree, same board, but SensorManager reads synthetic sensor data injected
; over a second USB serial port (SerialUSB1, enabled via usb_type below)
; instead of the real I2C sensors, so the exact same compiled StateMachine/
; BackupDeploy/AttitudeController/FinController/PyroController code that
; flies for real can be exercised against Simulation/hitl/'s closed-loop
; Simulink model before ever trusting it in the air. See Packet.h's
; SensorInjectPacket/HITLResponsePacket and Simulation/hitl/TeensyBridge.m.
;
; The default `rocketpower` env above is completely unaffected by this --
; HITL_MODE only changes anything inside `#ifdef HITL_MODE` blocks (see
; SensorManager.cpp, TelemetryManager.cpp, FinController's liveCorrectionDeg
; getter). Flash THIS env only for a bench HITL run, never for a real flight:
;   pio run -e rocketpower_hitl -t upload
[env:rocketpower_hitl]
platform  = teensy
board     = teensy41
framework = arduino

lib_deps = ${env:rocketpower.lib_deps}

build_flags =
    -DROCKETPOWER
    -DHITL_MODE
    ; Second Teensy USB virtual serial port (SerialUSB1), dedicated to the
    ; HITL protocol -- keeps it off the normal Serial, which stays fully
    ; usable for command RX and the existing telemetry mirror (a real
    ; GroundStation can watch a HITL run live at the same time the
    ; simulation is driving it). This platformio-teensy build (unlike some
    ; other Teensy PlatformIO platforms) has no board_build.usb_type option
    ; -- it reads this straight from usb_desc.h's own #if defined(...)
    ; chain, so the raw -D flag below is the actual, verified way to select
    ; it here (confirmed by a real `pio run -e rocketpower_hitl` build).
    -DUSB_DUAL_SERIAL
    -O2

monitor_speed = 115200
